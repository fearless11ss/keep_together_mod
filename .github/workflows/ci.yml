name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew clean test cyclonedxBom --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: server-sbom
          path: '**/build/reports/cyclonedx*/bom.*'
          if-no-files-found: error

  forge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew clean build cyclonedxBom --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: forge-sbom
          path: mod/build/reports/cyclonedx*/bom.*
          if-no-files-found: error

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.16.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
      - run: npx --yes @cyclonedx/cdxgen@12.9.0 --type js --output build/reports/web.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: website-sbom
          path: web/build/reports/web.cdx.json
          if-no-files-found: error
